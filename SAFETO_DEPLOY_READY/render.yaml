services:
  - type: web
    name: safeto-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /var/data/data.json
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: safeto-data
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: safeto-web
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
